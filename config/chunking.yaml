paths:
  input_jsonl: "data/prepared/prepared_documents.jsonl"
  output_jsonl: "data/chunks/chunks.jsonl"

chunking:
  strategy: sentence            # sentence — устойчиво к переносам строк из PDF; paragraph для PDF не подходит
  chunk_size: 700               # жёсткий верхний предел длины чанка в символах (~150-180 слов)
  chunk_overlap: 120            # BASELINE. Перекрытие в символах.
                                # УЛУЧШЕНИЕ 1: поставить 250 ПОСЛЕ прогона baseline.
                                # Проблема baseline на q2: заголовок кейса «8.1. Горно-металлургическая
                                # компания» остался в предыдущем чанке, а цифры эффектов попали
                                # в следующий без привязки к компании — модель отказалась их связывать.
                                # 250 символов покрывают заголовок раздела и первую строку,
                                # гранулярность при этом не страдает (в отличие от подъёма chunk_size).
                                # Эффект: число чанков вырастает с 58 до 71, нужна переиндексация.
  split_long_sentences: true    # длинные перечисления режутся по словам, лимит остаётся реальным
