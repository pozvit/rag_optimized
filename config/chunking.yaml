paths:
  input_jsonl: "data/prepared/prepared_documents.jsonl"
  output_jsonl: "data/chunks/chunks.jsonl"

chunking:
  strategy: section             # разбиение по заголовкам разделов; baseline sentence
                                # Причина: при sentence заголовок кейса «8.1. Горно-металлургическая
                                # компания» оказывался в предыдущем чанке, и показатели теряли
                                # привязку (q2). Раздел теперь чанкуется целиком со своим заголовком,
                                # а при переполнении заголовок повторяется в каждой части.
  chunk_size: 1000              # верхний предел длины чанка; baseline 700
  chunk_overlap: 150            # baseline 120 -> итерация 1: 250 -> финал: 150
  split_long_sentences: true    # длинные перечисления режутся по словам, лимит остаётся реальным
