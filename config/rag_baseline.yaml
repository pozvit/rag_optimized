# BASELINE — ЗАМОРОЖЕННАЯ КОНФИГУРАЦИЯ. НЕ РЕДАКТИРОВАТЬ.
#
# Снимок настроек, на которых снят исходный прогон (results/baseline/).
# Нужен, чтобы сравнение «до/после» опиралось на файл, а не на память.
# Все улучшения вносятся в config/rag.yaml.
#
# Чанкинг baseline: chunk_size 700, chunk_overlap 120 (см. config/chunking.yaml).
#
# Запуск baseline:
#   python src/rag_eval.py --config config/rag_baseline.yaml --label baseline

paths:
  qdrant_storage: "data/qdrant_storage"
  results_dir: "results"

retrieval:
  collection_name: "rag_documents"
  top_k: 5                                      # значение по умолчанию, переопределяется параметром --top-k
                                                # 3 -> 5: длинные перечисления (8 модулей ERGO, эффекты IBP)
                                                # разъезжаются по соседним чанкам и при top_k=3 терялись
  score_threshold: 0.0                          # 0.0 = не отсекать; для e5 ориентир 0.75-0.80 после замера score
  model_name: "intfloat/multilingual-e5-small"  # ОБЯЗАТЕЛЬНО та же модель, что и на этапе embeddings
  query_prefix: "query: "                       # префикс E5 для запросов
  normalize_embeddings: true

context:
  # Бюджет контекста считается от окна модели: у YandexGPT 5 Lite это 32 768 токенов
  # на весь запрос (system + context + вопрос + ответ). Для русского текста ориентир
  # ~3-4 символа на токен, то есть 12 000 символов ≈ 3 500-4 000 токенов —
  # вместе с max_tokens: 700 это меньше 15% окна, запас многократный.
  max_chars_per_chunk: 2000        # 1200 -> 2000: чанк максимум 713 символов, обрезка не срабатывает,
                                   # но лимит перестаёт мешать при переходе на chunk_size 1000-1200
  max_context_chars: 12000         # 6000 -> 12000: 5 чанков по ~700 символов + метаданные помещаются целиком
  include_metadata: true           # выводить в контекст источник, категорию и версию документа

llm:
  provider: "openai_compatible"    # openai_compatible | yandex | none (none = только retrieval)
  model: "yandexgpt-5-lite/latest" # идентификатор из карточки модели в Yandex AI Studio
                                   # (кнопка «URI инстанса»). Короткое имя достраивается
                                   # до gpt://<YC_FOLDER_ID>/<model>; можно указать полный URI.
                                   # Переопределяется переменной LLM_MODEL.
  base_url: "https://llm.api.cloud.yandex.net/v1"   # OpenAI-совместимый эндпоинт Yandex Cloud
  temperature: 0.0                 # фактологические ответы: без креатива
                                   # (в карточке модели дефолт 0.3 — для RAG он лишний)
  max_tokens: 700                  # верхняя граница ответа; у Lite потолок генерации ~2000 токенов
  timeout_seconds: 60
  # Ключ и folder_id — только в .env: LLM_API_KEY и YC_FOLDER_ID.
  # OpenAI:  base_url https://api.openai.com/v1,      LLM_MODEL=gpt-4o-mini
  # Ollama:  base_url http://localhost:11434/v1,      LLM_MODEL=qwen2.5:7b-instruct, ключ не нужен
  # provider: "yandex" — нативный API Foundation Models (запасной путь, если
  # OpenAI-совместимый слой недоступен); тогда ключ берётся из YC_API_KEY,
  # а base_url клиент сам подменяет на .../foundationModels/v1/completion.

prompt:
  system: |
    Ты — ассистент, отвечающий на вопросы строго по предоставленному контексту.
    Правила:
    1. Используй ТОЛЬКО информацию из контекста. Внешние знания использовать запрещено.
    2. Если в контексте нет ответа, ответь ровно: «Недостаточно информации в предоставленных документах.»
       и не добавляй никаких предположений.
    3. Не выдумывай числа, названия и факты. Числа приводи ровно так, как в контексте.
    4. Отвечай кратко, по делу, на русском языке.
    5. В конце ответа укажи использованные фрагменты в формате: Источники: [Фрагмент N, ...].
