# Тестовый набор для проверки пайплайна (задание требует 5 вопросов разных типов).
questions:
  - id: q1
    type: "факт есть в документах"
    question: "Сколько сегментов рынка микроэлектроники моделируется в бизнес-симуляторе ERGO и какие это сегменты?"
    expected: "5 сегментов: военная электроника, электронные компоненты, промышленная электроника, low-end (потребительская), hi-end (премиум)."

  - id: q2
    type: "факт есть в документах"
    question: "Какие экономические эффекты были получены при внедрении интегрированного планирования в горно-металлургической компании?"
    expected: "15% сокращение затрат на логистику, 10% снижение сверхнормативных простоев и длительности оборота полувагонов, до 12% оптимизация интермодальных ставок; срок проекта 9 месяцев."

  - id: q3
    type: "факт есть в документах"
    question: "Какие три цифровых решения входят в цифровое ядро AIMS?"
    expected: "Цифровой паспорт актива, цифровой пульс актива, цифровая биржа имущества."

  - id: q4
    type: "поиск в конкретном документе/разделе"
    question: "В описании SIPS: какие критерии и ограничения заданы в примере оптимизации инвестиционной программы железнодорожной сети и как изменился объём электрификации путей?"
    expected: "CAPEX < 700 млрд руб., выполнение 100% целей правительства, сокращение недовывоза с 25% до 10%; электрификация путей сократилась с 200 км до 135 км."

  - id: q5
    type: "ответа в документах нет"
    question: "Сколько стоит годовая лицензия на SIPS и какова стоимость внедрения продукта для компании из 500 сотрудников?"
    expected: "Ответа нет в документах — система должна сообщить о недостатке информации."

  - id: q6
    type: "переформулировка (формулировка отличается от текста документа)"
    question: "Как быстро ежегодно прирастает рынок складов и промплощадок в России и Казахстане?"
    expected: "Россия 7–10% в год, Казахстан около 20% в год. В документе это названо «средний ежегодный темп роста рынка индустриальной инфраструктуры»."
    expected_source: "05_integral360_infrastructure_design.pdf, раздел 1 «Рыночный контекст»"
